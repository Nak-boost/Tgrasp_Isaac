graphics_device_id: 0
dexrep:
  sample_method: average
  sample_num_points: 2048
  batch_norm_pnfeat: false
  ambient_voxel_length: 0.02
  dis_max_range: 0.2
env:
  env_name: shadow_hand_grasp_dexrep
  numEnvs: 1024
  envSpacing: 1.5
  episodeLength: 800
  ppoRolloutSteps: 32
  enableDebugVis: false
  aggregateMode: 1
  random_time: true
  goal_cond: false
  num_objs: 20
  object_code_dict:
  - hammer
  - cubesmall
  - banana
  - stamp
  - cubemedium
  - toruslarge
  - duck
  - spherelarge
  - mouse
  - airplane
  - cylinderlarge
  - stapler
  - flute
  - piggybank
  - alarmclock
  - eyeglasses
  - gamecontroller
  - phone
  - torusmedium
  - knife
  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: false
  dofSpeedScale: 20.0
  actionsMovingAverage: 0.2
  controlFrequencyInv: 1
  startPositionNoise: 0.0
  startRotationNoise: 0.0
  resetPositionNoise: 0.0
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.0
  resetDofVelRandomInterval: 0.0
  distRewardScale: 0.5
  transition_scale: 0.15
  orientation_scale: 0.1
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: -0.0002
  reachGoalBonus: 160
  fallDistance: 0.4
  fallPenalty: 0.0
  objectType: pot
  observationType: tactile
  obs_dim:
    prop: 89
    current_touch: 56
    relative_object_position: 3
  obs_encoders:
    prop:
      type: mlp
      hidden_dims:
      - 256
      - 128
      activation: elu
      embedding_normalization: layer_norm
    current_touch:
      type: touch
      hidden_dims:
      - 32
      - 64
      activation: elu
      embedding_normalization: layer_norm
    relative_object_position:
      type: identity
    oracle_object:
      type: object
      hidden_dims:
      - 128
      - 128
      activation: elu
      embedding_normalization: layer_norm
    voxel_map:
      type: voxel
      embedding_normalization: layer_norm
    local_voxel_map:
      type: local_voxel
      embedding_normalization: layer_norm
    touch_history:
      type: history
      frame_hidden_dims:
      - 128
      frame_embedding_dim: 128
      recurrent_hidden_dim: 128
      activation: elu
      embedding_normalization: layer_norm
  tactile:
    enabled: true
    initial_hand:
      corner: false
      random_xy: true
      face_center: false
      height_above_table: 0.15
      inside_probability: 1.0
    workspace:
      enabled: true
      max_height_above_table: 0.5
      failure_penalty: 10.0
    hand_dof_count: 22
    experiment: E3
    contact_loss_reset_steps: 100
    relative_object_position:
      enabled: true
      source: tactile_estimate
      mask_probability: 0.0
      scale:
      - 0.35
      - 0.35
      - 0.4
      estimator:
        reliable_alpha: 0.6
        fallback_alpha: 0.2
        fallback_quality: 0.3
        quality_decay: 0.99
        minimum_quality: 0.1
        minimum_contacts: 2
        minimum_eigenvalue_ratio: 0.05
        maximum_residual: 0.03
        minimum_forward_fraction: 0.6
        maximum_center_distance: 0.2
        maximum_hand_distance: 0.4
        maximum_height_above_table: 0.4
      oracle_during_training: false
    touch:
      include_sensor_positions: true
      position_scale: 0.2
      layout: pad14
      asset_file: mjcf/open_ai_assets/hand/shadow_hand_tactile.xml
      force_mode: normal
      on_threshold: 1.0
      off_threshold: 0.5
    reward:
      per_finger_contact: 0.01
      valid_grasp_contact: 0.02
      valid_grasp_steps: 3
      upward_action: 0.075
      upward_action_saturation: 0.3
      lift_height: 0.5
      lift_target_height: 0.12
      lift_hold: 0.5
      lift_hold_steps: 10
      estimated_reach: 1.0
      reach_palm_weight: 0.5
      reach_distal_weight: 1.0
      reach_middle_weight: 0.25
      reach_proximal_weight: 0.0
      voxel_exploration: 0.05
      voxel_exploration_new_voxel_cap: 4
      voxel_exploration_height_layers: 5
      palm_up_penalty: 0.05
      palm_up_penalty_angle_degrees: 90.0
      open_hand_penalty: 0.005
    history:
      length: 8
      frame_dim: 130
    voxel:
      channels: 2
      grid_size:
      - 32
      - 32
      - 16
      lower:
      - -0.35
      - -0.35
      - 0.6
      upper:
      - 0.35
      - 0.35
      - 0.95
      recency_decay: 0.98
      expiration_threshold: 0.1
      transformer_layers: 2
      attention_heads: 4
      feedforward_dim: 128
    local_voxel:
      enabled: true
      channels: 8
      grid_size:
      - 12
      - 12
      - 8
    search_only: false
  objectPositionRandomization:
    enabled: true
    xRange:
    - -0.1
    - 0.1
    yRange:
    - -0.1
    - 0.1
  handAgentIndex: '[[0, 1, 2, 3, 4, 5]]'
  asymmetric_observations: true
  privileged_geometry:
    enabled: true
    num_points: 256
    distance_scale: 0.2
  successTolerance: 0.1
  printNumSuccesses: false
  maxConsecutiveSuccesses: 0
  clip_observations: 5.0
  asset:
    assetRoot: ../assets
    assetFileName: mjcf/open_ai_assets/hand/shadow_hand.xml
    assetFileNameBlock: urdf/objects/cube_multicolor.urdf
    assetFileNameBall: urdf/objects/ball.urdf
    assetFileNameEgg: mjcf/open_ai_assets/hand/egg.xml
    assetFileNamePen: mjcf/open_ai_assets/hand/pen.xml
    assetFileNameObj: /grab_meshdata/
    assetFileNameObj_raw: /grab_raw_models/
task:
  randomize: false
  randomization_params:
    frequency: 600
    observations:
      range:
      - 0
      - 0.002
      range_correlated:
      - 0
      - 0.001
      operation: additive
      distribution: gaussian
      schedule: linear
      schedule_steps: 40000
    actions:
      range:
      - 0.0
      - 0.05
      range_correlated:
      - 0
      - 0.015
      operation: additive
      distribution: gaussian
      schedule: linear
      schedule_steps: 40000
    sim_params:
      gravity:
        range:
        - 0
        - 0.4
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
    actor_params:
      hand:
        color: true
        tendon_properties:
          damping:
            range:
            - 0.3
            - 3.0
            operation: scaling
            distribution: loguniform
            schedule: linear
            schedule_steps: 30000
          stiffness:
            range:
            - 0.75
            - 1.5
            operation: scaling
            distribution: loguniform
            schedule: linear
            schedule_steps: 30000
        dof_properties:
          damping:
            range:
            - 0.3
            - 3.0
            operation: scaling
            distribution: loguniform
            schedule: linear
            schedule_steps: 30000
          stiffness:
            range:
            - 0.75
            - 1.5
            operation: scaling
            distribution: loguniform
            schedule: linear
            schedule_steps: 30000
          lower:
            range:
            - 0
            - 0.01
            operation: additive
            distribution: gaussian
            schedule: linear
            schedule_steps: 30000
          upper:
            range:
            - 0
            - 0.01
            operation: additive
            distribution: gaussian
            schedule: linear
            schedule_steps: 30000
        rigid_body_properties:
          mass:
            range:
            - 0.5
            - 1.5
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range:
            - 0.7
            - 1.3
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 30000
      object:
        scale:
          range:
          - 0.95
          - 1.05
          operation: scaling
          distribution: uniform
          schedule: linear
          schedule_steps: 30000
        rigid_body_properties:
          mass:
            range:
            - 0.5
            - 1.5
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range:
            - 0.7
            - 1.3
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 30000
sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1
    contact_collection: 2
    num_position_iterations: 8
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75
