graphics_device_id: 0
dexrep:
  sample_method: 'average'
  sample_num_points: 2048
  batch_norm_pnfeat: False
  ambient_voxel_length: 0.02
  dis_max_range: 0.2
env:
  env_name: "shadow_hand_grasp_dexrep"
  numEnvs: 1024
  envSpacing: 1.5
  episodeLength: 200 # 250
  enableDebugVis: False
  aggregateMode: 1

  random_time: True
  goal_cond: False
  num_objs: 2

  object_code_dict:
    - 'cubemedium'
    - 'spherelarge'

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  dofSpeedScale: 20.0
  actionsMovingAverage: 1.0
  controlFrequencyInv: 1 # 60 Hz

  startPositionNoise: 0.0
  startRotationNoise: 0.0

  resetPositionNoise: 0.0
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.0
  resetDofVelRandomInterval: 0.0

  distRewardScale: 20
  transition_scale: 0.5
  orientation_scale: 0.1
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: -0.0002
  reachGoalBonus: 250
  fallDistance: 0.4
  fallPenalty: 0.0

  objectType: "pot" 
  observationType: "tactile"

  # obs_dim is rebuilt at runtime from tactile.experiment.
  # The values below describe E1 and preserve prop as the first branch,
  # which is required by PPO1 RolloutStorage.
  obs_dim:
    prop: 89
    current_touch: 5

  obs_encoders:
    prop:
      type: "mlp"
      hidden_dims: [256, 128]
      activation: "elu"

    current_touch:
      type: "touch"
      hidden_dims: [32, 64]
      activation: "elu"
      # BN is applied to the 128-dimensional embedding, never to raw
      # five-dimensional binary touch.
      embedding_batch_norm: True

    oracle_object:
      type: "object"
      hidden_dims: [128, 128]
      activation: "elu"
      embedding_batch_norm: True

    voxel_map:
      type: "voxel"
      embedding_batch_norm: True

    touch_history:
      type: "history"
      frame_hidden_dims: [128]
      frame_embedding_dim: 128
      recurrent_hidden_dim: 128
      activation: "elu"
      embedding_batch_norm: True

  tactile:
    enabled: True

    # The loaded Shadow Hand has 22 joint DOFs. The policy still has
    # 24 actions: 6 floating-base commands and 18 actuator commands.
    hand_dof_count: 22

    # E1: prop + current_touch
    # E2: prop + current_touch + oracle_object
    # E3: prop + current_touch + voxel_map
    # E4: prop + current_touch + touch_history
    experiment: "E2"

    touch:
      # Raw Isaac Gym force-sensor units.
      # Hysteresis avoids rapid binary-touch switching near threshold.
      on_threshold: 1.0
      off_threshold: 0.5

    reward:
      # Shared by E1-E4. These terms use binary fingertip touch only.
      # Applied once when at least one fingertip is touching.
      contact: 0.05
      # Applied for every touching fingertip beyond the first.
      multi_contact: 0.02
      # Applied for each fingertip that remains in contact.
      contact_hold: 0.01
      # Subtracted for each fingertip that loses contact.
      contact_loss: 0.05
      # Object-center height used only for the episode lift metric.
      lift_height: 0.80

    history:
      # Each frame contains:
      # fingertip positions (15), touch (5),
      # q/qd/wrist proprioception (50), previous action (24).
      length: 8
      frame_dim: 94

    voxel:
      # Channel 0: potential object location.
      #   1 = unknown or possible object location.
      #   0 = recently explored free space.
      #
      # Channel 1: historical contact confidence.
      #   1 = current contact; it decays toward 0.
      #
      # Channel 2: observation age.
      #  -1 = never explored.
      #   0 = observed during the current step.
      #  (0, 1] = normalized time since the latest observation.
      #
      # An additional observed/free channel is unnecessary because
      # potential already records free-space evidence and age=-1
      # explicitly distinguishes unknown from explored voxels.
      channels: 3
      grid_size: [16, 16, 8]
      lower: [-0.35, -0.35, 0.55]
      upper: [0.35, 0.35, 0.95]
      max_age: 64

      # Contact evidence decays after contact disappears. Potential
      # gradually returns toward 1 so stale free-space evidence does
      # not permanently exclude a movable object from that location.
      contact_decay: 0.95
      potential_recovery: 0.005

      # Fingertip trajectory sampling and voxel dilation.
      sweep_samples: 8
      contact_exclusion_samples: 1
      free_radius_voxels: 0
      contact_radius_voxels: 1

      # Reject likely table contacts when writing object-contact evidence.
      minimum_object_touch_z: 0.62

  objectPositionRandomization:
    enabled: True
    xRange: [-0.15, 0.15]
    yRange: [-0.15, 0.15]

  handAgentIndex: "[[0, 1, 2, 3, 4, 5]]"
  asymmetric_observations: False
  successTolerance: 0.1
  printNumSuccesses: False
  maxConsecutiveSuccesses: 0

  clip_observations: 5.0
  asset:
    assetRoot: "../assets"
    assetFileName: "mjcf/open_ai_assets/hand/shadow_hand.xml"
    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"
    assetFileNameBall: "urdf/objects/ball.urdf"
    assetFileNameEgg: "mjcf/open_ai_assets/hand/egg.xml"
    assetFileNamePen: "mjcf/open_ai_assets/hand/pen.xml"
    assetFileNameObj: "/grab_meshdata/"
    assetFileNameObj_raw: "/grab_raw_models/"
task:
  randomize: False
  randomization_params:
    frequency: 600   # Define how many simulation steps between generating new randomizations
    observations:
      range: [ 0, .002 ] # range for the white noise
      range_correlated: [ 0, .001 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"   # "constant" is to turn on noise after `schedule_steps` num steps
      schedule_steps: 40000
    actions:
      range: [ 0., .05 ]
      range_correlated: [ 0, .015 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      schedule_steps: 40000
    sim_params:
      gravity:
        range: [ 0, 0.4 ]
        operation: "additive"
        distribution: "gaussian"
        schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
        schedule_steps: 40000
    actor_params:
      hand:
        color: True
        tendon_properties:
          damping:
            range: [ 0.3, 3.0 ]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          stiffness:
            range: [ 0.75, 1.5 ]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        dof_properties:
          damping:
            range: [ 0.3, 3.0 ]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          stiffness:
            range: [ 0.75, 1.5 ]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          lower:
            range: [ 0, 0.01 ]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          upper:
            range: [ 0, 0.01 ]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_body_properties:
          mass:
            range: [ 0.5, 1.5 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [ 0.7, 1.3 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
      object:
        scale:
          range: [ 0.95, 1.05 ]
          operation: "scaling"
          distribution: "uniform"
          schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
          schedule_steps: 30000
        rigid_body_properties:
          mass:
            range: [ 0.5, 1.5 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [ 0.7, 1.3 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8 # 8 bottle
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75